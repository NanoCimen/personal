concept_contract: source/concept-contract.yaml
identity_bible: source/identity-bible.md
parameter_space: discrete
media_access: random
gesture_policy:
  unit: one-gesture-one-step
  inertia: coalesce
  while_active: retarget
  boundary: clamp
  programmatic_navigation: ignore

storyboard:
  - K0: idle — typing on laptop, subtle breathing/blink micro-loop (rest state)
  - K1: glance-left — looks up toward cursor when it's in the left zone
  - K2: glance-right — looks up toward cursor when it's in the right zone
  - K3: stretch-and-smile — leans back from laptop, stretches, smiles toward cursor when it's close/hovering near the character

keyframes: [K0, K1, K2, K3]

clip_chain:
  - { clip: K0-to-K1, from: K0, to: K1, reverse: scrub-back (no new clip) }
  - { clip: K0-to-K2, from: K0, to: K2, reverse: scrub-back (no new clip) }
  - { clip: K0-to-K3, from: K0, to: K3, reverse: scrub-back (no new clip) }
  - { clip: K0-idle-loop, from: K0, to: K0, type: seamless autonomous loop }

rest_state: K0 idle-loop (typing + breathing), plays autonomously whenever pointer is far from the character or inactive
loop: closed
anchor: bottom
scene_continuity: null
frame_policy: native
target_fps: 24
quality_target: 2x DPR, small-file budget (~1-2MB per clip, alpha-video delivery)
aspect_ratio: custom (3:4 portrait)
pixel_dimensions: 720x960 (base 360x480 CSS px @2x)
reduced_motion: single static K0 frame (idle typing pose), no animation, no autoplay
