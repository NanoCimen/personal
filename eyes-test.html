<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  body{margin:0;background:#fff;background-image:linear-gradient(to right, rgba(0,0,0,.06) 1px, transparent 1px),linear-gradient(to bottom, rgba(0,0,0,.06) 1px, transparent 1px);background-size:24px 24px;display:flex;align-items:center;justify-content:center;min-height:100vh;}

  .hero-illo{display:inline-block;}
  .hero-mascot-motion{position:relative;display:inline-block;}
  .hero-person{display:block;width:340px;height:auto;}

  /* zero-size anchor points, positioned right below each existing eyebrow mark in the artwork */
  .hero-eye{ position:absolute; width:0; height:0; }
  .hero-eye.eye-left{ left:46.9%; top:31.3%; }
  .hero-eye.eye-right{ left:56.6%; top:33.5%; }

  /* iris: fixed in place, never moves, so it can never overlap the eyebrow */
  .hero-eye .iris{
    position:absolute;
    left:0; top:0;
    width:17px; height:17px;
    margin-left:-8.5px; margin-top:-8.5px;
    background:#1a1a1a;
    border-radius:50%;
  }
  /* highlight: the only thing that tracks the cursor, clamped to stay inside the iris */
  .hero-eye .highlight{
    position:absolute;
    left:0; top:0;
    width:6px; height:6px;
    margin-left:-3px; margin-top:-3px;
    background:#fff;
    border-radius:50%;
    will-change:transform;
  }
</style>
</head>
<body>

<span class="hero-illo" aria-hidden="true">
  <span class="hero-mascot-motion">
    <img class="hero-person" src="assets/hero/sittingport.png" alt="">
    <span class="hero-eye eye-left"><i class="iris"></i><i class="highlight"></i></span>
    <span class="hero-eye eye-right"><i class="iris"></i><i class="highlight"></i></span>
  </span>
</span>

<script>
  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var eyes = document.querySelectorAll('.hero-eye');

  function updateEyes(clientX, clientY){
    eyes.forEach(function(eye){
      var highlight = eye.querySelector('.highlight');
      var rect = eye.getBoundingClientRect();
      var dx = clientX - rect.left;
      var dy = clientY - rect.top;
      var maxD = 4.5; // px — stays well inside the 17px iris, can never reach its edge
      var dist = Math.min(maxD, Math.hypot(dx,dy) * 0.1);
      var angle = Math.atan2(dy,dx);
      highlight.style.transform = 'translate(' + (Math.cos(angle)*dist).toFixed(2) + 'px,' + (Math.sin(angle)*dist).toFixed(2) + 'px)';
    });
  }

  if(!reduceMotion){
    window.addEventListener('mousemove', function(e){ updateEyes(e.clientX, e.clientY); });
  }

  window.__testEyes = updateEyes;
</script>

</body>
</html>
